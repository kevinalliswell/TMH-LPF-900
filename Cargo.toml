[workspace]
resolver = "2"
members = ["crates/tmh-protocols", "crates/tmh-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "Proprietary"
authors = ["USTB TMH-LPF-900 Team"]

[workspace.dependencies]
crc = "3"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
serialport = "4"

[profile.release]
strip = true
lto = true
