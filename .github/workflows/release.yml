name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify tag metadata and main provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release.mjs "${GITHUB_REF_NAME}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::release tag must point at the current main tip"
            exit 1
          }

  release:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Windows Authenticode signing is OPTIONAL and requires a real certificate
      # (Azure Trusted Signing or an OV/EV cert + cloud HSM — docs/09 §9.2). To enable,
      # set bundle.windows.signCommand/certificateThumbprint in tauri.conf.json and
      # provide the cert to the runner. Without it the NSIS installer is unsigned
      # (SmartScreen shows "unknown publisher"); everything else still works.
      - name: Build bundles, sign updater artifacts & draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater minisign signing (docs/09 §9.2). Required by
          # createUpdaterArtifacts; generates the .sig files + latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TMH-LPF-900 ${{ github.ref_name }}
          releaseBody: "See CHANGELOG.md. NSIS offline installer + signed updater artifacts (latest.json). Windows Authenticode signing requires a certificate — see docs/09."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
