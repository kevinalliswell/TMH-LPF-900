name: Release

on:
  push:
    tags: ["v*"]

jobs:
  rust-audit:
    name: RustSec release
    uses: ./.github/workflows/rust-audit.yml
  source-sbom:
    name: Release source SBOM
    uses: ./.github/workflows/source-sbom.yml
  verify-version:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.validation.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify tag metadata and protected main provenance
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          node scripts/check-release.mjs "${GITHUB_REF_NAME}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')" = true || {
            echo "::error::main must be protected before a formal release"
            exit 1
          }
          test "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$(git rev-parse HEAD)" --event push --status success --limit 1 --json databaseId --jq length)" = 1 || {
            echo "::error::main commit must have a successful push CI run before tagging"
            exit 1
          }

  release:
    needs: [verify-version, rust-audit, source-sbom]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Windows Authenticode signing is OPTIONAL and requires a real certificate
      # (Azure Trusted Signing or an OV/EV cert + cloud HSM — docs/09 §9.2). To enable,
      # set bundle.windows.signCommand/certificateThumbprint in tauri.conf.json and
      # provide the cert to the runner. Without it the NSIS installer is unsigned
      # (SmartScreen shows "unknown publisher"); everything else still works.
      - name: Build bundles, sign updater artifacts & draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater minisign signing (docs/09 §9.2). Required by
          # createUpdaterArtifacts; generates the .sig files + latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TMH-LPF-900 ${{ github.ref_name }}
          releaseBody: "See CHANGELOG.md. NSIS offline installer + signed updater artifacts (latest.json). Windows Authenticode signing requires a certificate — see docs/09."
          releaseDraft: true
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }} -- --locked

  inventory:
    needs: [release, source-sbom]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: source-sbom-${{ github.run_id }}
          path: verification/
      - name: Inventory completed draft assets and source evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,url > verification/draft-release.json
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          node scripts/package-release.mjs release-assets verification/source-sbom.cdx.json verification/draft-release.json "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
          gh release upload "$GITHUB_REF_NAME" release-assets/source-sbom.cdx.json release-assets/manifest.json release-assets/SHA256SUMS.txt release-assets/*.md --clobber
      - name: Preserve complete draft inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 30
