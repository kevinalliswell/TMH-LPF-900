name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main: PRs into feature/ and
  # integration/ branches were merging with no CI at all, which is how a whole class
  # of runtime-only breakage reached main unnoticed (#40).
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: RustSec CI
    uses: ./.github/workflows/rust-audit.yml
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux Tauri system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libudev-dev

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Record verification context
        run: pnpm verify:context

      - name: Frontend typecheck / lint / test
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm lint
          pnpm test:scripts 2>&1 | tee verification/script-tests.log
          pnpm test 2>&1 | tee verification/frontend-tests.log

      - name: Frontend build (produces dist/ for tauri context)
        run: pnpm build

      - name: Tauri security configuration
        run: pnpm check:tauri-security

      # Catches Rust/TS drift in IPC argument names, which is invisible to both test
      # suites (frontend tests run against the browser mock) but fails at runtime (#40).
      - name: IPC argument-name contract
        run: pnpm check:ipc-contract

      - name: Rust DTO to TypeScript contract
        run: pnpm check:ipc-types

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level moderate

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked 2>&1 | tee verification/rust-tests.log

      - name: Compile serial feature (skeleton, not hardware-tested)
        run: cargo build -p tmh-core --features serial --locked

      - name: Headless soak (replay dirty session + short mock)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p tmh-core --example soak --locked -- --replay fixtures/dirty-session.jsonl 2>&1 | tee verification/replay.log
          cargo run -p tmh-core --example soak --locked -- --minutes 5 2>&1 | tee verification/mock-soak.log

      - name: Version consistency
        run: node scripts/sync-version.mjs --check

      - name: Dependency-direction guard (tmh-core / tmh-protocols must not depend on tauri)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for crate in tmh-core tmh-protocols; do
            if cargo tree -p "$crate" -e normal,build --locked --prefix none | grep -qiE '^tauri'; then
              echo "::error::$crate must not depend on tauri"
              cargo tree -p "$crate" -e normal,build --locked
              fail=1
            else
              echo "ok: $crate has no tauri dependency"
            fi
          done
          exit $fail

      - name: Preserve verification evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_id }}
          path: verification/
          if-no-files-found: warn
          retention-days: 30
