name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux Tauri system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck / lint / test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Frontend build (produces dist/ for tauri context)
        run: pnpm build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Version consistency
        run: node scripts/sync-version.mjs --check

      - name: Dependency-direction guard (tmh-core / tmh-protocols must not depend on tauri)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for crate in tmh-core tmh-protocols; do
            if cargo tree -p "$crate" -e normal,build --prefix none | grep -qiE '^tauri'; then
              echo "::error::$crate must not depend on tauri"
              cargo tree -p "$crate" -e normal,build
              fail=1
            else
              echo "ok: $crate has no tauri dependency"
            fi
          done
          exit $fail
